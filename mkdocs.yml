site_name: streamlit-extras
site_url: https://arnaudmiribel.github.io/streamlit-extras/
repo_name: arnaudmiribel/streamlit-extras
repo_url: https://github.com/arnaudmiribel/streamlit-extras

extra_css:
  - assets/custom.css

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.expand
    - content.code.annotate
    - content.code.select
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_signature_annotations: false
            separate_signature: false
            extra:
              show_types_in_signature: true
  - literate-nav:
      nav_file: SUMMARY.md
  - gen-files:
      scripts:
        - docs/generate.py

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Browse extras:
      - Overview: extras/index.md
      - Reference: extras/
  - Streamlit components: components.md
  - Contributing: contributing.md
  - For AI agents: agents.md
  - Deprecated extras: extras_deprecated/

markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      toc_depth: "3"
