site_name: streamlit-extras
site_url: https://arnaudmiribel.github.io/streamlit-extras/
repo_name: arnaudmiribel/streamlit-extras
repo_url: https://github.com/arnaudmiribel/streamlit-extras

extra_css:
  - assets/custom.css

extra_javascript:
  - assets/copy-page.js

theme:
  name: shadcn
  custom_dir: overrides
  favicon: assets/logo.png
  show_stargazers: false
  hide_source_files: true
  show_datetime: false
  accent: "oklch(53% 0.17 258)"

plugins:
  - shadcn/search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_signature_annotations: false
            separate_signature: false
            extra:
              show_types_in_signature: true
  - literate-nav:
      nav_file: SUMMARY.md
  - gen-files:
      scripts:
        - docs/generate.py

hooks:
  - docs/shadcn_compat.py

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Browse extras: extras/index.md
  - Streamlit components: components.md
  - Contributing: contributing.md
  - For AI agents: agents.md
  - Deprecated extras: extras_deprecated/
  - Extras reference: extras/

markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      toc_depth: "3"
