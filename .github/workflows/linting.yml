name: linting

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: pre-commit/action@v3.0.1
