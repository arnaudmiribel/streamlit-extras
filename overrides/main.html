{% extends "base.html" %}

{% block content %}
  {% if page and page.markdown %}
    <div class="extras-page-tools">
      <span class="extras-page-tools__label">Documentation</span>
      <button class="extras-copy-page" type="button" aria-describedby="extras-copy-status">
        Copy page as Markdown
      </button>
      <span id="extras-copy-status" class="extras-copy-status" role="status" aria-live="polite"></span>
    </div>
    <script type="application/json" id="extras-page-markdown">{{ page.markdown | tojson }}</script>
  {% endif %}
  {{ super() }}
{% endblock %}
